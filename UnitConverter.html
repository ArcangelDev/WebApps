<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Unit Converter</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; text-align: center; }
        .group { margin-bottom: 1.5rem; border-bottom: 1px solid #eee; pb: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .result { font-weight: bold; color: #2c3e50; background: #ecf0f1; padding: 10px; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Unit Converter</h2>

    <div class="group">
        <label>Length</label>
        <input type="number" id="lengthInput" placeholder="Enter value" oninput="convertLength()">
        <select id="lengthFrom" onchange="convertLength()">
            <option value="m">Meters (m)</option>
            <option value="km">Kilometers (km)</option>
            <option value="cm">Centimeters (cm)</option>
            <option value="mm">Millimeters (mm)</option>
            <option value="mi">Miles (mi)</option>
            <option value="yd">Yards (yd)</option>
            <option value="ft">Feet (ft)</option>
            <option value="in">Inches (in)</option>
        </select>
        <select id="lengthTo" onchange="convertLength()">
            <option value="m">Meters (m)</option>
            <option value="km" selected>Kilometers (km)</option>
            <option value="cm">Centimeters (cm)</option>
            <option value="mm">Millimeters (mm)</option>
            <option value="mi">Miles (mi)</option>
            <option value="yd">Yards (yd)</option>
            <option value="ft">Feet (ft)</option>
            <option value="in">Inches (in)</option>
        </select>
        <div class="result" id="lengthResult">Result: --</div>
    </div>

    <div class="group">
        <label>Temperature</label>
        <input type="number" id="tempInput" placeholder="Enter value" oninput="convertTemp()">
        <select id="tempFrom" onchange="convertTemp()">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>
        <select id="tempTo" onchange="convertTemp()">
            <option value="C">Celsius (°C)</option>
            <option value="F" selected>Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>
        <div class="result" id="tempResult">Result: --</div>
    </div>

    <div class="group">
        <label>Weight / Mass</label>
        <input type="number" id="weightInput" placeholder="Enter value" oninput="convertWeight()">
        <select id="weightFrom" onchange="convertWeight()">
            <option value="g">Grams (g)</option>
            <option value="kg">Kilograms (kg)</option>
            <option value="mg">Milligrams (mg)</option>
            <option value="lb">Pounds (lb)</option>
            <option value="oz">Ounces (oz)</option>
            <option value="st">Stone (st)</option>
        </select>
        <select id="weightTo" onchange="convertWeight()">
            <option value="g">Grams (g)</option>
            <option value="kg" selected>Kilograms (kg)</option>
            <option value="mg">Milligrams (mg)</option>
            <option value="lb">Pounds (lb)</option>
            <option value="oz">Ounces (oz)</option>
            <option value="st">Stone (st)</option>
        </select>
        <div class="result" id="weightResult">Result: --</div>
    </div>
</div>

<script>
    // Length Factors relative to 1 Meter
    const lengthFactors = {
        m: 1, km: 1000, cm: 0.01, mm: 0.001,
        mi: 1609.34, yd: 0.9144, ft: 0.3048, in: 0.0254
    };

    function convertLength() {
        const val = parseFloat(document.getElementById('lengthInput').value);
        const from = document.getElementById('lengthFrom').value;
        const to = document.getElementById('lengthTo').value;
        if (isNaN(val)) return;

        // Convert to meters, then to target unit
        const meters = val * lengthFactors[from];
        const result = meters / lengthFactors[to];
        document.getElementById('lengthResult').innerText = `Result: ${result.toFixed(4)} ${to}`;
    }

    function convertTemp() {
        const val = parseFloat(document.getElementById('tempInput').value);
        const from = document.getElementById('tempFrom').value;
        const to = document.getElementById('tempTo').value;
        if (isNaN(val)) return;

        let celsius;
        // Convert to Celsius first
        if (from === "C") celsius = val;
        else if (from === "F") celsius = (val - 32) * 5/9;
        else if (from === "K") celsius = val - 273.15;

        let result;
        // Convert Celsius to target
        if (to === "C") result = celsius;
        else if (to === "F") result = (celsius * 9/5) + 32;
        else if (to === "K") result = celsius + 273.15;

        document.getElementById('tempResult').innerText = `Result: ${result.toFixed(2)} °${to}`;
    }

    // Weight Factors relative to 1 Gram
    const weightFactors = {
        g: 1, kg: 1000, mg: 0.001,
        lb: 453.592, oz: 28.3495, st: 6350.29
    };

    function convertWeight() {
        const val = parseFloat(document.getElementById('weightInput').value);
        const from = document.getElementById('weightFrom').value;
        const to = document.getElementById('weightTo').value;
        if (isNaN(val)) return;

        const grams = val * weightFactors[from];
        const result = grams / weightFactors[to];
        document.getElementById('weightResult').innerText = `Result: ${result.toFixed(4)} ${to}`;
    }
</script>

</body>
</html>
